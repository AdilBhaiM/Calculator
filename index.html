<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="main_group">
        <div class="head flex items-center justify-between">
            <h1 class="mb-1 text-3xl font-bold text-heading"><span class="text-transparent bg-clip-text bg-gradient-to-r to-emerald-600 from-sky-400">Scientific </span>Calculator</h1>
            <svg class="reset" width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 20.5001C16.6944 20.5001 20.5 16.6945 20.5 12.0001C20.5 9.17456 19.1213 6.67103 17 5.1255M13 22.4001L11 20.4001L13 18.4001M12 3.5001C7.30558 3.5001 3.5 7.30568 3.5 12.0001C3.5 14.8256 4.87867 17.3292 7 18.8747M11 5.6001L13 3.6001L11 1.6001" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="inputs">
            <input disabled placeholder="Your Expression..." type="text" name="text" class="exp">
            <div class="equal border border-[1.5px] cursor-pointer rounded-lg w-[45px] h-[45px] flex items-center justify-center">
                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 9H19M5 15H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <p class="output self-center">Output</p>
        </div>
        <div class="buttons flex flex-row gap-4">
            <div class="Numbers flex flex-1 flex-col gap-4">
                <div class="grid grid-cols-3 gap-4">
                    <div class="num flex justify-center items-center border h-12 rounded-md">1</div>
                    <div class="num flex justify-center items-center border h-12 rounded-md">2</div>
                    <div class="num flex justify-center items-center border h-12 rounded-md">3</div>
                    <div class="num flex justify-center items-center border h-12 rounded-md">4</div>
                    <div class="num flex justify-center items-center border h-12 rounded-md">5</div>
                    <div class="num flex justify-center items-center border h-12 rounded-md">6</div>
                    <div class="num flex justify-center items-center border h-12 rounded-md">7</div>
                    <div class="num flex justify-center items-center border h-12 rounded-md">8</div>
                    <div class="num flex justify-center items-center border h-12 rounded-md">9</div>
                </div>
                <div class="num flex justify-center items-center border h-12 rounded-md">0</div>
            </div>
            <div class="operators grid gap-4">
                <div class="grid grid-cols-3 gap-4">
                <div class="op flex justify-center items-center border h-12 w-12 rounded-md">+</div>
                <div class="op flex justify-center items-center border h-12 w-12 rounded-md">-</div>
                <div class="op flex justify-center items-center border h-12 w-12 rounded-md">*</div>
                <div class="op flex justify-center items-center border h-12 w-12 rounded-md">/</div>
                <div class="op flex justify-center items-center border h-12 w-12 rounded-md">^</div>
                <div class="op flex justify-center items-center border h-12 w-12 rounded-md">√</div>
                <div class="op flex justify-center items-center border h-12 w-12 rounded-md">Sin</div>
                <div class="op flex justify-center items-center border h-12 w-12 rounded-md">Cos</div>
                <div class="op flex justify-center items-center border h-12 w-12 rounded-md">Tan</div>
            </div>
            <div class="brackets flex flex-row gap-4">
                <div class="op flex justify-center flex-1 items-center border h-12 w-12 rounded-md">(</div>
                <div class="op flex justify-center flex-1 items-center border h-12 w-12 rounded-md">)</div>
            </div>
            </div>
        </div>
    </div>
</body>
<script src="./index2.js"></script>
</html>
